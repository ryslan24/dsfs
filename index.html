<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С Днём Рождения, Света!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050510; font-family: sans-serif; }
    
    #floatingCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    .card {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2;
      background: rgba(15, 15, 30, 0.85); backdrop-filter: blur(10px);
      padding: 40px; border-radius: 25px; border: 2px solid #ff2a8d;
      box-shadow: 0 0 40px rgba(255, 0, 128, 0.5); text-align: center; color: #fff;
      max-width: 90%; width: 450px;
    }
    .card h1 { font-size: 2.3rem; margin-bottom: 20px; color: #ff2a8d; text-shadow: 0 0 15px #ff2a8d; }
    .card p { font-size: 1.15rem; line-height: 1.6; color: #e0e0ff; }
  </style>
</head>
<body>

  <canvas id="floatingCanvas"></canvas>

  <div class="card">
    <h1>С Днём Рождения, Света! ✨</h1>
    <p>Пусть твоя жизнь будет такой же яркой, красивой и вдохновляющей! Желаю бесконечного счастья, море улыбок и исполнения всех самых заветных желаний!Бурмалда
      💖🎉</p>
  </div>

  <script>
    const canvas = document.getElementById('floatingCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Загрузка фото
    const images = [];
    const imageSources = ['photo1.png', 'photo2.png'];
    let imagesLoaded = 0;

    imageSources.forEach(src => {
      const img = new Image();
      img.src = src; 
      img.onload = () => {
        imagesLoaded++;
        if (imagesLoaded === imageSources.length) {
          startAnimation();
        }
      };
      images.push(img);
    });

    // Класс для летающих фото
    class FloatingPhoto {
      constructor() { this.reset(); }
      reset() {
        this.img = images[Math.floor(Math.random() * images.length)];
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 80 + 60;
        this.speedX = (Math.random() - 0.5) * 1.5;
        this.speedY = (Math.random() - 0.5) * 1.5;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.02;
        this.opacity = Math.random() * 0.5 + 0.5;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.opacity;
        ctx.drawImage(this.img, -this.size / 2, -this.size / 2, this.size, this.size);
        ctx.restore();
      }
      update() {
        this.x += this.speedX; this.y += this.speedY; this.rotation += this.rotSpeed;
        if (this.x < -this.size || this.x > canvas.width + this.size || 
            this.y < -this.size || this.y > canvas.height + this.size) {
          this.reset();
        }
      }
    }

    // Класс для бóльших и более ярких сердечек
    class Heart {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        // Размер увеличен: от 20px до 65px
        this.size = Math.random() * 45 + 20; 
        this.speedX = (Math.random() - 0.5) * 1.8;
        this.speedY = (Math.random() - 0.5) * 1.8;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.03;
        const colors = ['#ff007f', '#ff00ff', '#ff1493', '#ff3366', '#ff0055', '#9d00ff'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.opacity = Math.random() * 0.6 + 0.4;
        this.pulse = Math.random() * Math.PI;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        
        // Легкая пульсация свечения
        const currentSize = this.size + Math.sin(this.pulse) * 4;
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.opacity;

        ctx.beginPath();
        const topCurveHeight = currentSize * 0.3;
        ctx.moveTo(0, topCurveHeight);
        ctx.bezierCurveTo(0, 0, -currentSize / 2, 0, -currentSize / 2, topCurveHeight);
        ctx.bezierCurveTo(-currentSize / 2, (currentSize + topCurveHeight) / 2, 0, currentSize, 0, currentSize);
        ctx.bezierCurveTo(0, currentSize, currentSize / 2, (currentSize + topCurveHeight) / 2, currentSize / 2, topCurveHeight);
        ctx.bezierCurveTo(currentSize / 2, 0, 0, 0, 0, topCurveHeight);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
      update() {
        this.x += this.speedX; 
        this.y += this.speedY; 
        this.rotation += this.rotSpeed;
        this.pulse += 0.05;

        if (this.x < -80 || this.x > canvas.width + 80 || 
            this.y < -80 || this.y > canvas.height + 80) {
          this.reset();
        }
      }
    }

    let items = [];
    function startAnimation() {
      // 15 фото + 80 бóльших неоновых сердечек
      const photos = Array.from({ length: 15 }, () => new FloatingPhoto());
      const hearts = Array.from({ length: 80 }, () => new Heart());
      items = [...photos, ...hearts];
      animate();
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      items.forEach(item => { item.update(); item.draw(); });
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
