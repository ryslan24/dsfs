<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С Днём Рождения, Лена!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050510; font-family: sans-serif; }
    
    #floatingCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    .card {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2;
      background: rgba(15, 15, 30, 0.85); backdrop-filter: blur(10px);
      padding: 40px; border-radius: 25px; border: 2px solid #ff2a8d;
      box-shadow: 0 0 40px rgba(255, 0, 128, 0.5); text-align: center; color: #fff;
      max-width: 90%; width: 450px;
    }
    .card h1 { font-size: 2.5rem; margin-bottom: 20px; color: #ff2a8d; text-shadow: 0 0 15px #ff2a8d; }
    .card p { font-size: 1.2rem; line-height: 1.6; color: #e0e0ff; }
  </style>
</head>
<body>

  <canvas id="floatingCanvas"></canvas>

  <div class="card">
    <h1>С Днём Рождения! ✨</h1>
    <p>Пусть каждый день будет таким же ярким, как этот неоновый сайт, и таким же запоминающимся, как эти моменты на фото! 🎁</p>
  </div>

  <script>
    const canvas = document.getElementById('floatingCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const images = [];
    // ЭТОТ МАССИВ МЫ ИСПРАВИЛИ
    const imageSources = [
      'photo1.png', // Теперь ссылка ведет на файл в репозитории
      'photo2.png'  // Теперь ссылка ведет на файл в репозитории
    ];

    let imagesLoaded = 0;
    imageSources.forEach(src => {
      const img = new Image();
      // Теперь мы используем локальную ссылку на файл
      img.src = src; 
      img.onload = () => {
        imagesLoaded++;
        if (imagesLoaded === imageSources.length) {
          startAnimation();
        }
      };
      images.push(img);
    });

    class FloatingItem {
      constructor() { this.reset(); }
      reset() {
        this.img = images[Math.floor(Math.random() * images.length)];
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 80 + 60; // Размер фото на экране
        this.speedX = (Math.random() - 0.5) * 1.5;
        this.speedY = (Math.random() - 0.5) * 1.5;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.02;
        this.opacity = Math.random() * 0.5 + 0.5;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.opacity;
        // Отрисовка картинки
        ctx.drawImage(this.img, -this.size / 2, -this.size / 2, this.size, this.size);
        ctx.restore();
      }
      update() {
        this.x += this.speedX; this.y += this.speedY; this.rotation += this.rotSpeed;
        if (this.x < -this.size || this.x > canvas.width + this.size || 
            this.y < -this.size || this.y > canvas.height + this.size) {
          this.reset();
        }
      }
    }

    let items;
    function startAnimation() {
      // Количество летающих фото
      items = Array.from({ length: 15 }, () => new FloatingItem());
      animate();
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      items.forEach(item => { item.update(); item.draw(); });
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
